name: Movie monitor and Pages

on:
  push:
    branches: [main]
    paths: ["backend/**", "bootstrap/**", "docs/**", ".github/workflows/**"]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Site operation
        type: choice
        default: check
        options: [check, status, configure]

permissions:
  contents: read

concurrency:
  group: polaris-scheduled-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run independent movie monitor
        id: monitor
        continue-on-error: true
        env:
          STATE_MASTER_KEY: ${{ secrets.WATCH_SITE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          WATCH_MODE: ${{ inputs.mode || 'check' }}
        run: node backend/run.mjs
      - name: Report a monitoring failure
        if: steps.monitor.outcome == 'failure'
        run: echo '::warning::The monitor failed. Existing state was retained where possible; check the Site status and run logs.'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publish:
    needs: watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment

  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep only this scheduler repository active
        run: |
          python3 - <<'PY'
          import pathlib, time
          p = pathlib.Path('.github/heartbeat')
          previous = int(p.read_text()) if p.exists() else 0
          if time.time() - previous >= 25 * 86400:
              p.write_text(str(int(time.time())) + '\n')
          PY
          if ! git diff --quiet -- .github/heartbeat || [ -n "$(git ls-files --others --exclude-standard .github/heartbeat)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/heartbeat
            git commit -m 'Keep scheduler active'
            git push origin HEAD:main
          fi
