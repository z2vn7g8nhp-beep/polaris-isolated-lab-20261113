</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="theme-color" content="#111211"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><div class="app"><aside class="sidebar"><div class="logo"><span class="mark">◉</span>开票雷达</div><div class="tag">MOVIE RADAR</div><nav aria-label="主导航"><button data-view="library" class="selected"><span>▦</span>电影片库</button><button data-view="stars"><span>☆</span>我的星标<span class="navcount" id="navstars">0</span></button><button data-view="events"><span>◷</span>提醒记录</button><button data-view="settings"><span>⚙</span>监测与推送</button></nav><div class="sidebottom"><div class="tinylabel">YOUR CINEMA CITY</div><div class="city">⌖ 西安 · XI'AN</div><p>MOMOPARK UME<br>西安荟聚寰映</p><p style="margin-top:22px;font-size:10px">每一场期待，都值得被记住。</p></div></aside><main class="main"><div class="top"><span class="breadcrumb">个人工作台 <span style="margin:0 10px">/</span> <b id="crumb">电影片库</b></span><span class="private">⌑ 私人配置加密同步</span></div><div id="content"><div class="loading">正在载入你的电影片库…</div></div></main></div><div role="status" aria-live="polite" class="toast hidden" id="toast"></div>
<script type="module">
import {api,connect,disconnect} from "./client.mjs?v=status-1";
import {pushSupport,enablePhonePush,disablePhonePush} from "./push.mjs?v=status-1";
import {isComing,groupComing} from "./catalog.mjs";
import {checkHealth} from "./status.mjs";
let data=null,view=new URLSearchParams(location.search).get('view')==='events'?'events':'library',filter='upcoming',search='',busy=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
function time(t){return t?new Date(t*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'尚未检查'}
async function load(){try{data=await api('state');render()}catch(e){if(!data)$('#content').innerHTML='<div class="empty"><strong>暂时无法连接</strong><p>'+esc(e.message)+'</p><button class="secondary" data-action="reload">重新连接</button></div>';else{render();toast(e.message)}}}
function banner(){
  const health=checkHealth(data);
  if(health.kind==='paused')return `<div class="statusbox warn"><span>◉ 监测已暂停 · ${esc(data.paused||health.message)}</span><button class="secondary" data-action="resume">手动恢复</button></div>`;
  if(health.kind==='error'||health.kind==='delayed'||health.kind==='unknown')return `<div class="statusbox warn"><span>△ ${esc(health.message)}</span><button class="secondary" data-action="tick">立即检查一次</button></div>`;
  if(!data.connected)return `<div class="statusbox"><span>片库已就绪。连接新仓库后即可星标电影、启用手机通知和同步提醒。</span><button class="secondary" data-view="settings">连接 GitHub →</button></div>`;
  if(data.syncError)return `<div class="statusbox warn"><span>个人数据同步暂时失败，正在显示上次保存的记录：${esc(data.syncError)}</span><button class="secondary" data-action="reload">重试同步</button></div>`;
  if(data.pending)return `<div class="statusbox"><span>配置已加密保存，等待后台处理；完成后会自动刷新。</span></div>`;
  if(data.notificationMode==='push'&&data.pushError)return `<div class="statusbox warn"><span>${esc(data.pushError)}</span><button class="secondary" data-view="settings">检查手机通知 →</button></div>`;
  if(!(data.notificationMode==='push'?data.pushConfigured:data.notificationMode==='bark'?data.barkConfigured:false))return '<div class="statusbox warn"><span>↗ 启用手机系统通知后，新开票提醒会送到手机；提醒记录会一直保留。</span><button class="secondary" data-view="settings">启用手机通知 →</button></div>';
  return `<div class="statusbox"><span><span class="dot"></span>最近检查成功 · 星标保留，直到你手动停止</span><span>${esc(time(data.lastSuccess))}</span></div>`;
}
function card(m){const img=String(m.img||'');const safe=/^https:\/\//.test(img)?img:'';return `<article class="card"><div class="poster">${safe?`<img src="${esc(safe)}" alt="${esc(m.name)}海报" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`:''}<button class="star ${m.active?'on':''}" data-star="${esc(m.id)}" aria-label="${m.active?'停止监测':'星标监测'}${esc(m.name)}" aria-pressed="${m.active}">${m.active?'★':'☆'}</button><span class="badge">${m.active?(m.upcoming?'持续监测中':'已上映 · 星标保留'):(m.upcoming?'待上映':'已上映')}</span></div><h3 title="${esc(m.name)}">${esc(m.name)}</h3><div class="meta"><span>${esc(m.release)}</span><span>${m.score?esc(m.score)+' 分':m.wish?(m.wish/10000).toFixed(1)+'万人想看':''}</span></div></article>`}
function renderCards(){if(!data)return;const list=data.movies.filter(m=>(view!=='stars'||m.active)&&(filter==='all'||(filter==='upcoming'?isComing(m):!m.upcoming))&&m.name.toLowerCase().includes(search.toLowerCase()));$('#cards').innerHTML=list.length?(filter==='upcoming'?comingList(list):list.map(card).join('')):'<div class="empty"><strong>'+(view==='stars'?'把期待的电影点亮':'没有匹配的电影')+'</strong><p>'+(view==='stars'?'在片库点击 ☆，待上映电影每轮新开票都会提醒。':'试试其他片名或切换分类。')+'</p></div>';$('#listcount').textContent=`共 ${list.length} 部${view==='stars'?'星标电影':'电影'} · ${filter==='upcoming'?'猫眼待映列表 · 按上映日期排列':'数据来自猫眼'}`}
function statusLabel(){const health=checkHealth(data);return health.kind==='paused'?'已暂停':health.kind==='error'?'检查失败，等待重试':health.kind==='delayed'?'检查已延迟':data.schedule?'计划约每 5 分钟，实际可能延迟':'调度计划未确认'}
function library(){const stars=data.movies.filter(m=>m.active&&m.upcoming).length;const sent=data.events.filter(e=>e.sent_at).length;return `<div class="eyebrow">KEEP YOUR NEXT MOVIE IN SIGHT</div><div class="hero"><div><h1>${view==='stars'?'把期待，交给雷达。':'好电影，别错过开票。'}</h1><p class="intro">${view==='stars'?'星标不会在提醒后自动结束。每一轮新开票，继续为你守候。':'收藏你期待的电影。新场次、补票开售，第一时间留意。'}</p></div><button class="primary" data-action="tick">↻ 检查开票</button></div><div class="stats"><div class="stat"><label>正在关注的待上映电影</label><strong>${stars}<span style="font-size:12px;color:var(--muted);margin-left:7px">部</span></strong><small>每轮开票 · 持续提醒</small></div><div class="stat"><label>固定监测影院</label><strong>02<span style="font-size:12px;color:var(--muted);margin-left:7px">家</span></strong><small>MOMOPARK / 西安荟聚</small></div><div class="stat"><label>最近一次成功检查</label><strong style="font-size:19px;padding:7px 0">${esc(time(data.lastSuccess))}</strong><small>${statusLabel()}</small></div></div>${banner()}<div class="tools"><div class="tabs" role="tablist"><button data-filter="upcoming" class="${filter==='upcoming'?'active':''}">猫眼待映</button><button data-filter="released" class="${filter==='released'?'active':''}">已上映</button><button data-filter="all" class="${filter==='all'?'active':''}">全部电影</button></div><label class="search">⌕ <input id="search" type="search" placeholder="搜索片名…" aria-label="搜索片名" value="${esc(search)}"></label></div><p class="countlabel" id="listcount"></p><div class="grid" id="cards"></div><div class="footnote"><span>☆ 点击海报星标，★ 再次点击可手动停止 · 已上映电影保留在片库，不触发开票提醒</span><span>片库更新 ${esc(time(filter==='upcoming'?(data.comingUpdated||data.catalogUpdated):data.catalogUpdated))}</span></div>`}
function settings(){return `<div class="eyebrow">YOUR PERSONAL WATCHTOWER</div><div class="hero"><div><h1>安心等开票。</h1><p class="intro">两家常去的影院，一个安静可靠的提醒入口。</p></div></div>${banner()}${connectionBox()}${phoneBox()}<div class="settingsgrid"><section class="section"><h2>Bark（可选）</h2><p>复用已有设备 Key，使用独立「电影开票」分组。不会修改或覆盖你的其他通知。</p><form id="barkform"><label for="barkkey" class="note">设备 Key</label><br><input id="barkkey" name="key" type="password" autocomplete="off" placeholder="${data.barkConfigured?'已加密保存；输入可更换':'从 Bark App 复制设备 Key'}" required minlength="8"><div class="actions"><button type="submit" class="primary">${data.barkConfigured?'更新 Key':'保存并启用'}</button>${data.barkConfigured?'<button type="button" class="secondary" data-action="bark/test">发送测试通知</button><button type="button" class="secondary" data-action="bark/remove">移除</button>':''}</div></form><div class="privacy">⌑ Key 加密保存于新仓库，公开文件中不会出现明文。<br>若 Bark 显示 https://api.day.app/你的Key/，只复制中间的 Key。</div>${data.barkError?'<p style="color:#e6c38b">'+esc(data.barkError)+'</p>':''}</section><section class="section"><h2>监测状态</h2><p><span class="dot"></span>${statusLabel()}</p><div class="note">${data.schedule?(data.schedule.frequency==='five_minutes'?'计划每 5 分钟检查两家影院，但 GitHub 定时可能严重延迟，不能保证准点。请以最近成功检查时间为准。':'后台每小时执行一次检查任务，每次检查两家影院。'):'调度状态尚未确认。'}<br>猫眼待映名单约每 30 分钟同步，热映名单约每 2 小时；想看人数和电影资料分批更新，当前片库目标约 1～2 小时覆盖一轮。请求串行进行，连续失败自动退避；遇到验证码或访问限制，暂停并通过已启用的通知渠道提示。<br>低频轮询可能错过短暂开票窗口，不保证秒级送达。</div><div class="actions"><button class="secondary" data-action="tick">立即检查一次</button><button class="secondary" data-action="${data.paused?'resume':'pause'}">${data.paused?'手动恢复':'暂停全部监测'}</button></div></section></div><section class="section"><h2>西安 · 只盯这两家</h2>${data.cinemas.map((c,i)=>`<div class="cinemaitem"><div><strong>${esc(c.name)}</strong><br><small>${esc(c.address)} · 猫眼 ID ${c.id}</small></div><div><small>最近检查 ${esc(time(data.checks[i]?.checked))}</small><br><a href="https://m.maoyan.com/cinema/${c.id}" target="_blank" rel="noopener noreferrer">在猫眼打开 ↗</a></div></div>`).join('')}</section><section class="section"><h2>什么算一轮新开票？</h2><div class="note">新场次首次可售、明确不可售后再次可售，以及可识别的售票批次变化，都会产生提醒。同一状态反复出现不会重复提醒。首次星标后，当前已可售场次也会提醒一次。<br>电影正式上映后，不再产生开票提醒，星标仍保留。提醒发送失败会保留并重试；手动取消星标会取消尚未发送的提醒。轮询间隔内发生且结束的变化可能无法被观察到。</div></section>`}
function events(){return `<div class="eyebrow">EVERY OPENING, REMEMBERED</div><div class="hero"><div><h1>提醒都有迹可循。</h1><p class="intro">最近 60 条记录，包含待发送、送达和风控暂停提醒。</p></div><button class="secondary" data-action="reload">刷新记录</button></div><div class="events">${data.events.length?data.events.map(e=>`<article class="event"><span class="eventicon">${e.kind==='risk'?'△':'✦'}</span><div><h3>${esc(e.title)}</h3><p>${esc(e.body)}</p><small>${esc(time(e.created_at))}${e.attempts?' · 已尝试 '+e.attempts+' 次':''}</small></div><span class="pill">${e.cancelled?'已取消':e.sent_at?'已交给推送服务':data.pushConfigured||data.barkConfigured?'等待发送':'待启用通知'}</span></article>`).join(''):'<div class="empty"><strong>暂时还没有开票提醒</strong><p>先去片库星标几部待上映电影，雷达会记住你的期待。</p><button class="primary" data-view="library">去电影片库 →</button></div>'}</div>`}
function render(){const names={library:'电影片库',stars:'我的星标',events:'提醒记录',settings:'监测与推送'};$('#crumb').textContent=names[view];$('#navstars').textContent=data.movies.filter(m=>m.active).length;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));$('#content').innerHTML=view==='settings'?settings():view==='events'?events():library();if(view==='library'||view==='stars')renderCards()}
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderCards()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='barkform')return;e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api('bark',{key:$('#barkkey').value.trim()});$('#barkkey').value='';toast('Bark Key 已加密保存，后台将在下一轮应用');await load()}catch(e){toast(e.message)}finally{b.disabled=false}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;search='';filter=view==='stars'?'all':'upcoming';render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.star){if(busy)return;busy=true;b.disabled=true;const m=data.movies.find(m=>m.id===b.dataset.star);try{await api('star',{id:m.id,active:!m.active});toast(m.active?'已提交停止监测':'已星标，后台将持续监测');await load()}catch(e){toast(e.message)}finally{busy=false;b.disabled=false}return}if(b.dataset.action){b.disabled=true;try{const action=b.dataset.action;if(action==='reload'){await load();return}const result=action==='push/remove'?await disablePhonePush():await api(action,{});if(action==='tick')toast(result.queued?'已提交检查，后台完成后自动刷新':result.paused?'监测已暂停，请查看状态':result.cooldown?'冷却中，下一次可检查：'+time(result.next):result.busy?'正在检查中，请稍后刷新':result.cinema?result.cinema+' 已检查，新增 '+result.newNotifications+' 条提醒':'片库已更新');else toast(['bark/test','push/test'].includes(action)?'测试请求已提交，后台执行后会推送到手机':action==='resume'?'已恢复监测，保留原有冷却时间':'设置已更新');await load()}catch(e){toast(e.message)}finally{b.disabled=false}}});

function connectionBox(){return `<section class="section" style="margin-bottom:20px"><h2>${data.connected?'GitHub 已连接':'连接你的新仓库'}</h2><p>${data.connected?'星标和推送设置加密同步到新仓库；密钥只保存在当前浏览器。':'片库可直接浏览。要保存星标和接收提醒，请连接一次 GitHub。'}</p>${data.connected?'<button class="secondary" data-disconnect="true">断开当前浏览器</button>':`<form id="connectform"><label class="note" for="githubtoken">GitHub Fine-grained token</label><br><input id="githubtoken" type="password" autocomplete="off" required placeholder="github_pat_…"><div class="actions"><button class="primary" type="submit">连接并同步</button><a class="secondary" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">创建仅限新仓库的密钥 ↗</a></div></form><div class="note" style="margin-top:14px">创建密钥时，Repository access 选择 Only select repositories，只选 <strong>polaris-isolated-lab-20261113</strong>；Repository permissions 中设置 <strong>Contents</strong> 和 <strong>Actions</strong> 为 <strong>Read and write</strong>。<br>以后在其他设备连接时使用同一个密钥，便可解密同步配置。不要把密钥填进仓库文件。</div>`}</section>`}
window.addEventListener('polaris-notice',e=>toast(e.detail));
document.addEventListener('submit',async e=>{if(e.target.id!=='connectform')return;e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await connect($('#githubtoken').value);toast('已连接新仓库，配置将加密同步');await load()}catch(error){toast(error.message)}finally{b.disabled=false}});
document.addEventListener('click',async e=>{if(!e.target.closest('[data-disconnect]'))return;disconnect();toast('已断开当前浏览器，后台监测保持原状');await load()});


function comingList(movies){
  const expected=[...movies].sort((a,b)=>b.wish-a.wish).slice(0,10);
  const expectedHtml=!search&&view==='library'?`<section class="expected"><h2>最受期待 <small>按想看人数</small></h2><div class="expected-strip">${expected.map((m,i)=>`<article class="expected-item"><div class="poster"><img src="${esc(m.img)}" alt="${esc(m.name)}海报" loading="lazy" referrerpolicy="no-referrer"><button class="star ${m.active?'on':''}" data-star="${esc(m.id)}" aria-label="星标${esc(m.name)}">${m.active?'★':'☆'}</button><span class="badge">${i+1}</span></div><h3>${esc(m.name)}</h3><small>${(m.wish||0).toLocaleString()} 人想看</small></article>`).join('')}</div></section>`:'';
  return `<div class="coming-panel">${expectedHtml}${groupComing(movies).map(g=>`<section class="coming-group"><h2>${esc(g.title)}</h2>${g.movies.map(m=>`<article class="coming-row"><img class="coming-poster" src="${esc(m.img)}" alt="${esc(m.name)}海报" loading="lazy" referrerpolicy="no-referrer"><div class="coming-info"><h3>${esc(m.name)}</h3><p class="wish"><strong>${(m.wish||0).toLocaleString()}</strong> 人想看</p><p class="cast">${m.actors?'主演：'+esc(m.actors):'主创信息待补充'}</p><small>${esc(m.release)} 上映</small></div><button class="row-star ${m.active?'selected':''}" data-star="${esc(m.id)}" aria-label="${m.active?'停止监测':'星标监测'}${esc(m.name)}">${m.active?'★ 已星标':'☆ 想看'}</button></article>`).join('')}</section>`).join('')}${data.comingTotal>movies.length&&!search?'<p class="note">猫眼待映条目正在后台分批补全，已收录 '+movies.length+' / '+data.comingTotal+' 部。</p>':''}</div>`;
}
function phoneBox(){
  const support=pushSupport();
  const help=support.ios&&!support.standalone?'iPhone：在 Safari 点「分享 → 添加到主屏幕」，再从桌面图标打开这个网站，然后启用通知。':!support.supported?'当前浏览器不支持系统通知。iPhone 需 iOS 16.4 以上，并从主屏幕打开。':support.permission==='denied'?'系统未允许通知，请在设备的通知设置中允许这个网页发送通知。':'点击启用后允许系统通知；网页关闭时也能接收。声音和显示方式仍由系统通知设置决定。';
  return `<section class="section phone-section"><h2>手机系统通知</h2><p>直接使用手机自带的通知，不需要 Bark。</p><div class="note">${help}</div><div class="actions"><button class="primary" data-enable-push ${!support.supported||support.ios&&!support.standalone||support.permission==='denied'?'disabled':''}>${data.pushConfigured?'重新连接本机通知':'启用手机通知'}</button>${data.pushConfigured?'<button class="secondary" data-action="push/test">发送测试通知</button><button class="secondary" data-action="push/remove">停用手机通知</button>':''}</div><div class="privacy">${data.pushConfigured?'通知连接已保存，接收设备为最近启用通知的那台设备。':'首次启用前，请先连接上方的 GitHub。'}<br>启用后点「发送测试通知」，确认这台手机能收到。</div>${data.pushError?'<p style="color:#e6c38b">'+esc(data.pushError)+'</p>':''}${data.requestResult?'<p class="note">最近一次测试：'+(data.requestResult.ok?'推送服务已接收，请查看手机':esc(data.requestResult.message))+'</p>':''}</section>`;
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-enable-push]');if(!b)return;b.disabled=true;try{await enablePhonePush();toast('手机通知已保存，后台将在下一轮接入；随后可发送测试通知');await load()}catch(error){toast(error.message)}finally{b.disabled=false}});

load();setInterval(()=>{if(document.visibilityState==='visible'&&document.activeElement?.tagName!=='INPUT')load()},60000);
</script></body></html>
