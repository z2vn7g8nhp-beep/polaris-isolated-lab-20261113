<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开票雷达 · 西安</title><link rel="modulepreload" href="./client.mjs?v=companion-1"><link rel="modulepreload" href="./push.mjs?v=companion-1"><link rel="stylesheet" href="./design.css?v=cinema-journal-1"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="theme-color" content="#f6f3ed"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="./features.css?v=companion-1"></head><body><div class="app"><aside class="sidebar"><a class="logo" href="./" aria-label="开票雷达首页"><span class="mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 2v36M2 20h36M7.3 7.3l25.4 25.4M7.3 32.7L32.7 7.3" stroke="currentColor" stroke-width="2.5"/></svg></span>开票雷达</a><div class="tag">A PERSONAL CINEMA JOURNAL</div><nav aria-label="主导航"><button data-view="library" class="selected"><span aria-hidden="true">▤</span>电影片库</button><button data-view="stars"><span aria-hidden="true">☆</span>我的星标<span class="navcount" id="navstars">0</span></button><button data-view="events"><span aria-hidden="true">◷</span>提醒记录</button><button data-view="settings"><span aria-hidden="true">☷</span>监测与推送</button></nav><div class="sidebottom"><div class="side-art" aria-hidden="true"><span>光</span><i></i><small>LIGHTS. CAMERA. ANTICIPATION.</small></div><div class="tinylabel">YOUR CINEMA CITY</div><div class="city">⌖ 西安 · XI'AN</div><p>MOMOPARK UME<br>西安荟聚寰映</p><p style="margin-top:22px;font-size:10px">每一场期待，都值得被记住。</p></div></aside><a class="skip-link" href="#content">跳转到内容</a><main class="main"><div class="top"><span class="breadcrumb">我的电影手记 <span style="margin:0 10px">/</span> <b id="crumb">电影片库</b></span><span class="private">⌑ 加密同步 · 私人影单</span></div><div id="content" tabindex="-1"><div class="loading">正在载入你的电影片库…</div></div></main></div><div role="status" aria-live="polite" class="toast hidden" id="toast"></div>
<script type="module">
import {monitorEligible} from './rules.mjs';
import {installFeatures,selection,libraryControls,filmStatus,onboarding,settingsExtras,eventView,browsing} from './features.mjs?v=companion-1';
import {api,connect,disconnect,deviceId} from "./client.mjs?v=companion-1";
import {pushSupport,enablePhonePush,disablePhonePush} from "./push.mjs?v=companion-1";
import {isComing,groupComing,posterUrl} from "./catalog.mjs?v=companion-1";
import {checkHealth} from "./status.mjs?v=companion-1";
let data=null,view=['library','stars','events','settings'].includes(new URLSearchParams(location.search).get('view'))?new URLSearchParams(location.search).get('view'):'library',filter='upcoming',search='';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const viewMemory={};
function remember(){try{sessionStorage.setItem('polaris.browse.v1',JSON.stringify({view,filter,search,browsing,viewMemory}))}catch{}}
const features=installFeatures({getData:()=>data,refresh:load,rerender:()=>render(),toast:text=>toast(text)});
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
function time(t){return t?new Date(t*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'尚未检查'}
function showState(next){data=next;const focused=document.activeElement;if(focused?.tagName==='INPUT'&&focused.id!=='search')return;const searching=focused?.id==='search',start=focused?.selectionStart,end=focused?.selectionEnd,scroll=window.scrollY,strip=$('.expected-strip')?.scrollLeft;render();if(strip&&$('.expected-strip'))$('.expected-strip').scrollLeft=strip;window.scrollTo(0,scroll);if(searching){$('#search')?.focus();try{$('#search')?.setSelectionRange(start,end)}catch{}}}
async function load(){try{showState(await api('state',{onUpdate:showState}))}catch(e){if(!data)$('#content').innerHTML='<div class="empty"><strong>暂时无法连接</strong><p>'+esc(e.message)+'</p><button class="secondary" data-action="reload">重新连接</button></div>';else{render();toast(e.message)}}}
function banner(){
  const health=checkHealth(data);
  if(health.kind==='paused')return `<div class="statusbox warn"><span>◉ 监测已暂停 · ${esc(data.paused||health.message)}</span><button class="secondary" data-action="resume">手动恢复</button></div>`;
  if(health.kind==='error'||health.kind==='delayed'||health.kind==='unknown')return `<div class="statusbox warn"><span>△ ${esc(health.message)}</span><button class="secondary" data-action="tick">立即检查一次</button></div>`;
  if(!data.connected)return `<div class="statusbox"><span>片库已就绪。连接新仓库后即可星标电影、启用手机通知和同步提醒。</span><button class="secondary" data-view="settings">连接 GitHub →</button></div>`;
  if(data.syncError)return `<div class="statusbox warn"><span>个人数据同步暂时失败，正在显示上次保存的记录：${esc(data.syncError)}</span><button class="secondary" data-action="reload">重试同步</button></div>`;
  if(data.connected&&!data.personalReady)return '<div class="statusbox"><span>片库已显示，正在同步你的星标和提醒…</span></div>';
  if(data.pending)return `<div class="statusbox"><span>配置已加密保存，等待后台处理；完成后会自动刷新。</span></div>`;
  if(data.notificationMode==='push'&&data.pushError)return `<div class="statusbox warn"><span>${esc(data.pushError)}</span><button class="secondary" data-view="settings">检查手机通知 →</button></div>`;
  if(!(data.notificationMode==='push'?data.pushConfigured:data.notificationMode==='bark'?data.barkConfigured:false))return '<div class="statusbox warn"><span>↗ 启用手机系统通知后，新开票提醒会送到手机；提醒记录会一直保留。</span><button class="secondary" data-view="settings">启用手机通知 →</button></div>';
  return `<div class="statusbox"><span><span class="dot"></span>最近检查成功 · 星标保留，直到你手动停止</span><span>${esc(time(data.lastSuccess))}</span></div>`;
}
function card(m){const img=posterUrl(m.img);const safe=/^https:\/\//.test(img)?img:'';return `<article class="card"><div class="poster">${safe?`<img src="${esc(safe)}" alt="${esc(m.name)}海报" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`:''}<button class="poster-open" data-detail="${esc(m.id)}" aria-label="查看${esc(m.name)}详情"></button><button class="star ${m.active?'on':''}" data-star="${esc(m.id)}" ${data.connected&&!data.personalReady||m.syncState==='saving'?'disabled':''} aria-label="${m.active?'停止监测':'星标监测'}${esc(m.name)}" aria-pressed="${m.active}">${m.active?'★':'☆'}</button><span class="badge">${m.active?(data.movieRules?.[m.id]?.paused?'提醒已暂停':monitorEligible(m,data.movieRules?.[m.id])?'持续监测中':'星标保留'):(m.upcoming?'待上映':'已上映')}</span></div><h3 title="${esc(m.name)}"><button class="film-title" data-detail="${esc(m.id)}">${esc(m.name)}</button></h3><div class="meta"><span>${esc(m.release)}</span><span>${m.score?esc(m.score)+' 分':m.wish?(m.wish/10000).toFixed(1)+'万人想看':''}</span></div>${filmStatus(m,data)}</article>`}
function renderCards(){if(!data)return;const list=selection(data.movies.filter(m=>(view!=='stars'||m.active)&&(filter==='all'||(filter==='upcoming'?isComing(m):!m.upcoming))),search);$('#cards').innerHTML=list.length?(filter==='upcoming'&&browsing.sort==='release'?comingList(list):list.map(card).join('')):'<div class="empty"><strong>'+(view==='stars'?'把期待的电影点亮':'没有匹配的电影')+'</strong><p>'+(view==='stars'?'在片库点击 ☆，待上映电影每轮新开票都会提醒。':'试试其他片名或切换分类。')+'</p></div>';$('#listcount').textContent=`共 ${list.length} 部${view==='stars'?'星标电影':'电影'} · ${{release:'按上映日期',wish:'按想看热度',score:'按评分'}[browsing.sort]}排列 · 数据来自猫眼`}
function cinemaMinutes(){return Number(data.cadence?.cinemaMinutes)||Number(data.schedule?.intervalMinutes)||5}
function statusLabel(){const health=checkHealth(data);return health.kind==='paused'?'已暂停':health.kind==='error'?'检查失败，等待重试':health.kind==='delayed'?'检查已延迟':data.schedule?`目标约每 ${cinemaMinutes()} 分钟，以成功时间为准`:'调度计划未确认'}
function heroArtwork(){
  const picks=[...data.movies].filter(m=>isComing(m)&&/^https:\/\//.test(posterUrl(m.img))).sort((a,b)=>(b.wish||0)-(a.wish||0)).slice(0,3);
  return `<div class="hero-art" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><span class="art-spark"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 2v36M2 20h36M7.3 7.3l25.4 25.4M7.3 32.7L32.7 7.3" stroke="currentColor" stroke-width="2.5"/></svg></span><span class="art-word">CINÉMA</span><div class="poster-composition">${picks.map((m,i)=>`<div class="art-poster art-poster-${i}"><img src="${esc(posterUrl(m.img))}" alt="" decoding="async" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'"><span>${String(i+1).padStart(2,'0')} / ${esc(m.name)}</span></div>`).join('')}</div><div class="art-foot"><span>THE NEXT GREAT STORY</span><span>IS WAITING FOR YOU.</span></div></div>`;
}
function library(){const stars=data.movies.filter(m=>m.active&&monitorEligible(m,data.movieRules?.[m.id])).length;return `<section class="cinema-hero" aria-label="你的私人电影手记"><div class="hero-copy"><div class="eyebrow"><span></span> FOR THE LOVE OF CINEMA</div><h1>${view==='stars'?'把期待，<br>交给雷达。':'生活的下一幕，<br>留给<span class="title-accent">好电影。</span>'}</h1><p class="intro">${view==='stars'?'每一颗星标，都是一场尚未赴约的相遇。<br>每一轮新开票，继续为你守候。':'记录想看的，守候即将上映的。<br>让每一场期待，都有回响。'}</p><button class="primary" data-action="tick"><span aria-hidden="true">↻</span> 检查开票 <span aria-hidden="true">↗</span></button><div class="hero-caption">XI’AN, CHINA <span>献给每一个热爱大银幕的人</span></div></div>${heroArtwork()}</section><div class="stats"><div class="stat"><label>正在监测的星标电影</label><strong>${data.personalReady===false?'同步中':stars}<span style="font-size:12px;color:var(--muted);margin-left:7px">部</span></strong><small>每轮开票 · 持续提醒</small></div><div class="stat"><label>固定监测影院</label><strong>02<span style="font-size:12px;color:var(--muted);margin-left:7px">家</span></strong><small>MOMOPARK / 西安荟聚</small></div><div class="stat"><label>最近一次成功检查</label><strong style="font-size:19px;padding:7px 0">${esc(time(data.lastSuccess))}</strong><small>${statusLabel()}</small></div></div>${banner()}${onboarding(data)}<div class="tools"><div class="tabs" role="group" aria-label="电影分类"><button data-filter="upcoming" class="${filter==='upcoming'?'active':''}" aria-pressed="${filter==='upcoming'}">猫眼待映</button><button data-filter="released" class="${filter==='released'?'active':''}" aria-pressed="${filter==='released'}">已上映</button><button data-filter="all" class="${filter==='all'?'active':''}" aria-pressed="${filter==='all'}">全部电影</button></div><label class="search">⌕ <input id="search" type="search" placeholder="搜索片名…" aria-label="搜索片名" value="${esc(search)}"></label></div>${libraryControls(data)}<p class="countlabel" id="listcount"></p><div class="grid" id="cards"></div><div class="footnote"><span>☆ 点击海报星标，★ 再次点击可手动停止 · 已上映电影保留在片库，可在详情中设置继续监测</span><span>片库整轮更新 ${esc(time(data.catalogCompleted||data.catalogUpdated))}</span></div>`}
function settings(){return `<div class="eyebrow">YOUR PERSONAL WATCHTOWER</div><div class="hero"><div><h1>安心等开票。</h1><p class="intro">两家常去的影院，一个安静可靠的提醒入口。</p></div></div>${banner()}${connectionBox()}${phoneBox()}${settingsExtras(data)}<div class="settingsgrid"><section class="section"><h2>Bark（可选）</h2><p>复用已有设备 Key，使用独立「电影开票」分组。不会修改或覆盖你的其他通知。</p><form id="barkform"><label for="barkkey" class="note">设备 Key</label><br><input id="barkkey" name="key" type="password" autocomplete="off" placeholder="${data.barkConfigured?'已加密保存；输入可更换':'从 Bark App 复制设备 Key'}" required minlength="8"><div class="actions"><button type="submit" class="primary">${data.barkConfigured?'更新 Key':'保存并启用'}</button>${data.barkConfigured?'<button type="button" class="secondary" data-action="bark/test">发送测试通知</button><button type="button" class="secondary" data-action="bark/remove">移除</button>':''}</div></form><div class="privacy">⌑ Key 加密保存于新仓库，公开文件中不会出现明文。<br>若 Bark 显示 https://api.day.app/你的Key/，只复制中间的 Key。</div>${data.barkError?'<p style="color:#e6c38b">'+esc(data.barkError)+'</p>':''}</section><section class="section"><h2>监测状态</h2><p><span class="dot"></span>${statusLabel()}</p><div class="note">${data.schedule?`配置外部定时后目标每 ${cinemaMinutes()} 分钟检查两家影院，GitHub 原生每 ${Number(data.schedule.fallbackMinutes)||5} 分钟计划保留兜底。任务启动可能延迟，请以最近成功检查时间为准。`:'调度状态尚未确认。'}<br>猫眼待映、热映名单、想看人数和电影资料以每 5 分钟整轮更新为目标；实际时间受任务启动和来源响应影响。请求串行进行，连续失败自动退避；遇到验证码或访问限制，暂停并通过已启用的通知渠道提示。<br>低频轮询可能错过短暂开票窗口，不保证秒级送达。</div><div class="actions"><button class="secondary" data-action="tick">立即检查一次</button><button class="secondary" data-action="${data.paused?'resume':'pause'}">${data.paused?'手动恢复':'暂停全部监测'}</button></div></section></div><section class="section"><h2>西安 · 只盯这两家</h2>${data.cinemas.map((c,i)=>`<div class="cinemaitem"><div><strong>${esc(c.name)}</strong><br><small>${esc(c.address)} · 猫眼 ID ${c.id}</small></div><div><small>最近检查 ${esc(time(data.checks[i]?.checked))}</small><br><a href="https://m.maoyan.com/cinema/${c.id}" target="_blank" rel="noopener noreferrer">在猫眼打开 ↗</a></div></div>`).join('')}</section><section class="section"><h2>什么算一轮新开票？</h2><div class="note">新场次首次可售、明确不可售后再次可售，以及可识别的售票批次变化，都会产生提醒。同一状态反复出现不会重复提醒。首次星标后，当前已可售场次也会提醒一次。<br>默认仅提醒正式上映前的开票。可在电影详情设置上映后继续监测的截止日期；星标始终保留。提醒发送失败会保留并重试；手动取消星标会取消尚未发送的提醒。轮询间隔内发生且结束的变化可能无法被观察到。</div></section>`}
function events(){return eventView(data)}
function render(){const names={library:'电影片库',stars:'我的星标',events:'提醒记录',settings:'监测与推送'};$('#crumb').textContent=names[view];$('#navstars').textContent=data.personalReady===false?'…':data.movies.filter(m=>m.active).length;document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('selected',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#content').innerHTML=view==='settings'?settings():view==='events'?events():library();if(view==='library'||view==='stars')renderCards();features.afterRender();remember()}
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderCards();remember()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='barkform')return;e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api('bark',{key:$('#barkkey').value.trim()});$('#barkkey').value='';toast('Bark Key 已加密保存，后台将在下一轮应用');await load()}catch(e){toast(e.message)}finally{b.disabled=false}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){if(!data)return;viewMemory[view]={search,filter,browsing:{...browsing},scroll:window.scrollY,strip:$('.expected-strip')?.scrollLeft||0};view=b.dataset.view;const saved=viewMemory[view];search=saved?.search||'';filter=saved?.filter||(view==='stars'?'all':'upcoming');if(saved)Object.assign(browsing,saved.browsing);const url=new URL(location.href);url.searchParams.set('view',view);history.replaceState(null,'',url);render();if($('.expected-strip'))$('.expected-strip').scrollLeft=saved?.strip||0;window.scrollTo({top:saved?.scroll||0});return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.star){if(b.disabled)return;b.disabled=true;const m=data.movies.find(m=>m.id===b.dataset.star);try{await api('star',{id:m.id,active:!m.active});toast(m.active?'已保存停止监测，等待后台应用':'已保存星标，等待后台应用');await load()}catch(e){toast(e.message)}finally{b.disabled=false}return}if(b.dataset.action){b.disabled=true;try{const action=b.dataset.action;if(action==='reload'){await load();return}const result=action==='push/remove'?await disablePhonePush():await api(action,{});if(action==='tick')toast(result.queued?'已提交检查，后台完成后自动刷新':result.paused?'监测已暂停，请查看状态':result.cooldown?'冷却中，下一次可检查：'+time(result.next):result.busy?'正在检查中，请稍后刷新':result.cinema?result.cinema+' 已检查，新增 '+result.newNotifications+' 条提醒':'片库已更新');else toast(['bark/test','push/test'].includes(action)?'测试请求已提交，后台执行后会推送到手机':action==='resume'?'已恢复监测，保留原有冷却时间':'设置已更新');await load()}catch(e){toast(e.message)}finally{b.disabled=false}}});

function connectionBox(){return `<section class="section" style="margin-bottom:20px"><h2>${data.connected?'GitHub 已连接':'连接你的新仓库'}</h2><p>${data.connected?'星标和推送设置加密同步到新仓库；密钥只保存在当前浏览器。':'片库可直接浏览。要保存星标和接收提醒，请连接一次 GitHub。'}</p>${data.connected?'<button class="secondary" data-disconnect="true">断开当前浏览器</button>':`<form id="connectform"><label class="note" for="githubtoken">GitHub Fine-grained token</label><br><input id="githubtoken" type="password" autocomplete="off" required placeholder="github_pat_…"><div class="actions"><button class="primary" type="submit">连接并同步</button><a class="secondary" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">创建仅限新仓库的密钥 ↗</a></div></form><div class="note" style="margin-top:14px">创建密钥时，Repository access 选择 Only select repositories，只选 <strong>polaris-isolated-lab-20261113</strong>；Repository permissions 中设置 <strong>Contents</strong> 和 <strong>Actions</strong> 为 <strong>Read and write</strong>。<br>以后在其他设备连接时使用同一个密钥，便可解密同步配置。不要把密钥填进仓库文件。</div>`}</section>`}
window.addEventListener('polaris-state',e=>showState(e.detail));
window.addEventListener('polaris-notice',e=>toast(e.detail));
document.addEventListener('submit',async e=>{if(e.target.id!=='connectform')return;e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await connect($('#githubtoken').value);toast('已连接新仓库，配置将加密同步');await load()}catch(error){toast(error.message)}finally{b.disabled=false}});
document.addEventListener('click',async e=>{if(!e.target.closest('[data-disconnect]'))return;disconnect();toast('已断开当前浏览器，后台监测保持原状');await load()});


function comingList(movies){
  const expected=[...movies].sort((a,b)=>b.wish-a.wish).slice(0,10);
  const expectedHtml=!search&&view==='library'?`<section class="expected"><h2><span class="section-kicker">THE WATCHLIST</span>银幕未启，期待先行<span class="heading-note">最受期待 / 按想看人数</span></h2><div class="expected-strip">${expected.map((m,i)=>`<article class="expected-item"><div class="poster"><img src="${esc(posterUrl(m.img))}" alt="${esc(m.name)}海报" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'"><button class="poster-open" data-detail="${esc(m.id)}" aria-label="查看${esc(m.name)}详情"></button><button class="star ${m.active?'on':''}" data-star="${esc(m.id)}" ${data.connected&&!data.personalReady||m.syncState==='saving'?'disabled':''} aria-label="${m.active?'停止监测':'星标监测'}${esc(m.name)}" aria-pressed="${m.active}">${m.active?'★':'☆'}</button><span class="badge">${i+1}</span></div><h3><button class="film-title" data-detail="${esc(m.id)}">${esc(m.name)}</button></h3><small>${(m.wish||0).toLocaleString()} 人想看</small></article>`).join('')}</div></section>`:'';
  return `<div class="coming-panel">${expectedHtml}${groupComing(movies).map(g=>`<section class="coming-group"><h2>${esc(g.title)}</h2>${g.movies.map(m=>`<article class="coming-row"><button class="poster-thumb" data-detail="${esc(m.id)}" aria-label="查看${esc(m.name)}详情"><img class="coming-poster" src="${esc(posterUrl(m.img))}" alt="${esc(m.name)}海报" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'"></button><div class="coming-info"><h3><button class="film-title" data-detail="${esc(m.id)}">${esc(m.name)}</button></h3><p class="wish"><strong>${(m.wish||0).toLocaleString()}</strong> 人想看</p><p class="cast">${m.actors?'主演：'+esc(m.actors):'主创信息待补充'}</p><small>${esc(m.release)} 上映</small>${filmStatus(m,data)}</div><button class="row-star ${m.active?'selected':''}" data-star="${esc(m.id)}" ${data.connected&&!data.personalReady||m.syncState==='saving'?'disabled':''} aria-label="${m.active?'停止监测':'星标监测'}${esc(m.name)}" aria-pressed="${m.active}">${m.active?'★ 已星标':'☆ 想看'}</button></article>`).join('')}</section>`).join('')}${data.comingTotal>movies.length&&!search?'<p class="note">猫眼待映条目正在后台分批补全，已收录 '+movies.length+' / '+data.comingTotal+' 部。</p>':''}</div>`;
}
function phoneBox(){
  const support=pushSupport();
  const help=support.ios&&!support.standalone?'iPhone：在 Safari 点「分享 → 添加到主屏幕」，再从桌面图标打开这个网站，然后启用通知。':!support.supported?'当前浏览器不支持系统通知。iPhone 需 iOS 16.4 以上，并从主屏幕打开。':support.permission==='denied'?'系统未允许通知，请在设备的通知设置中允许这个网页发送通知。':'点击启用后允许系统通知；网页关闭时也能接收。声音和显示方式仍由系统通知设置决定。';
  return `<section class="section phone-section"><h2>手机系统通知</h2><p>直接使用手机自带的通知，不需要 Bark。</p><div class="note">${help}</div><label class="note" for="device-name">本机名称</label><br><input id="device-name" maxlength="40" placeholder="例如：我的 iPhone" value="${esc(data.pushDevices?.find(d=>d.id===deviceId())?.name||'')}"><div class="actions"><button class="primary" data-enable-push ${!support.supported||support.ios&&!support.standalone||support.permission==='denied'?'disabled':''}>${data.pushConfigured?'重新连接本机通知':'启用手机通知'}</button>${data.pushConfigured?'<button class="secondary" data-action="push/test">发送测试通知</button><button class="secondary" data-action="push/remove">停用本机通知</button>':''}</div><div class="privacy">${data.pushConfigured?'通知连接已保存，可在下方管理各设备。':'首次启用前，请先连接上方的 GitHub。'}<br>启用后点「发送测试通知」，确认这台手机能收到。</div>${data.pushError?'<p style="color:#e6c38b">'+esc(data.pushError)+'</p>':''}${data.requestResult?'<p class="note">最近一次测试：'+(data.requestResult.ok?'推送服务已接收，请查看手机':esc(data.requestResult.message))+'</p>':''}</section>`;
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-enable-push]');if(!b)return;b.disabled=true;try{await enablePhonePush($('#device-name')?.value.trim());toast('手机通知已保存，后台将在下一轮接入；随后可发送测试通知');await load()}catch(error){toast(error.message)}finally{b.disabled=false}});

try{const saved=JSON.parse(sessionStorage.getItem('polaris.browse.v1'));if(saved){Object.assign(browsing,saved.browsing);Object.assign(viewMemory,saved.viewMemory||{});if(!location.search){view=['library','stars','events','settings'].includes(saved.view)?saved.view:view;filter=saved.filter||filter;search=saved.search||''}}}catch{}
load();setInterval(()=>{if(document.visibilityState==='visible'&&document.activeElement?.tagName!=='INPUT')load()},60000);
</script></body></html>
